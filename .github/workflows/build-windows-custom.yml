name: Build RustDesk Windows Custom

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    env:
      RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: 15.0.6

      - name: Build RustDesk
        shell: bash
        run: |
          python3 build.py --portable --flutter

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir rustdesk-release
          cp -r flutter/build/windows/x64/runner/Release/* rustdesk-release/

      - name: Upload RustDesk
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: rustdesk-release
