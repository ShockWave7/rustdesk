name: Build RustDesk Windows Only

on:
  workflow_dispatch:
  push:
    branches:
      - master # или имя вашей ветки

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  UPLOAD_ARTIFACT: "true"
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-pc-windows-msvc, os: windows-2022, arch: x86_64, flutter-arch: x64, vcpkg-triplet: x64-windows-static, build-args: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Автоматическое внедрение вашего сервера и ключа
      - name: Inject custom Server and Public Key into config
        shell: bash
        run: |
          cat << 'EOF' > patch_config.py
          import os, re

          server = os.environ.get("RENDEZVOUS_SERVER", "").strip()
          key = os.environ.get("RS_PUB_KEY", "").strip()

          config_files = []
          for root, dirs, files in os.walk("."):
              if "config.rs" in files and "hbb_common" in root:
                  config_files.append(os.path.join(root, "config.rs"))

          if not config_files:
              print("WARNING: config.rs in hbb_common not found!")
          else:
              for config_file in config_files:
                  print(f"Patching {config_file}...")
                  with open(config_file, "r", encoding="utf-8") as f:
                      content = f.read()

                  if server:
                      print(f"Setting RENDEZVOUS_SERVERS -> {server}")
                      content = re.sub(
                          r'(pub const RENDEZVOUS_SERVERS:\s*&[^=]+=\s*&\[).*?(\];)',
                          lambda m: f'{m.group(1)}"{server}"{m.group(2)}',
                          content,
                          flags=re.DOTALL
                      )

                  if key:
                      print(f"Setting RS_PUB_KEY -> {key}")
                      content = re.sub(
                          r'(pub const RS_PUB_KEY:\s*&[^=]+=\s*")[^"]*(";)',
                          lambda m: f'{m.group(1)}{key}{m.group(2)}',
                          content
                      )

                  with open(config_file, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Patch applied successfully.")
          EOF
          python3 patch_config.py

      # Восстановление bridge (правильное имя артефакта bridge-artifact)
      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # Сборка Flutter приложения
      - name: Build rustdesk
        shell: bash
        run: |
          export VCPKG_ROOT="$VCPKG_ROOT"
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mkdir -p ./rustdesk
          cp -r ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release/* ./rustdesk/

      # Загрузка WindowInjection.dll (правильное имя артефакта topmostwindow-artifacts-x64)
      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # Упаковка всего клиента в единый переносимый .exe
      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./Output
          cp ./target/release/rustdesk-portable-packer.exe ./Output/rustdesk-x64.exe || cp ./target/release/*.exe ./Output/rustdesk-x64.exe

      # Сохранение готового файла
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Windows-x64
          path: |
            ./Output/*.exe
